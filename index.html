<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Demandes internes</title>
  <style>
    :root {
      --bg: #f1f5f9;
      --carte: #ffffff;
      --texte: #0f172a;
      --texte-doux: #64748b;
      --bordure: #e2e8f0;
      --primaire: #4f46e5;
      --primaire-fonce: #4338ca;
      --ouvert: #2563eb;
      --ouvert-fond: #dbeafe;
      --encours: #d97706;
      --encours-fond: #fef3c7;
      --termine: #059669;
      --termine-fond: #d1fae5;
      --erreur: #dc2626;
      --erreur-fond: #fee2e2;
      --ombre: 0 1px 3px rgba(15, 23, 42, .08), 0 8px 24px rgba(15, 23, 42, .06);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0b1120;
        --carte: #151e32;
        --texte: #e2e8f0;
        --texte-doux: #94a3b8;
        --bordure: #263349;
        --ouvert-fond: #1e3a8a55;
        --encours-fond: #78350f55;
        --termine-fond: #06503955;
        --erreur-fond: #7f1d1d55;
        --ombre: 0 1px 3px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .3);
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--texte);
      line-height: 1.5;
      min-height: 100vh;
    }

    /* ---------- En-tête ---------- */
    header {
      background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 55%, #db2777 100%);
      color: white;
      padding: 3rem 1.5rem 6rem;
    }
    .conteneur { max-width: 1050px; margin: 0 auto; }
    header h1 { font-size: 2rem; letter-spacing: -.02em; }
    header p { opacity: .85; margin-top: .25rem; }

    /* ---------- Mise en page ---------- */
    main {
      max-width: 1050px;
      margin: -4rem auto 3rem;
      padding: 0 1.5rem;
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 1.5rem;
      align-items: start;
    }
    @media (max-width: 820px) {
      main { grid-template-columns: 1fr; }
    }

    .carte {
      background: var(--carte);
      border: 1px solid var(--bordure);
      border-radius: 16px;
      box-shadow: var(--ombre);
      padding: 1.5rem;
    }
    .carte h2 { font-size: 1.1rem; margin-bottom: 1rem; }

    /* ---------- Formulaire ---------- */
    label {
      display: block;
      font-size: .8rem;
      font-weight: 600;
      color: var(--texte-doux);
      margin-bottom: .3rem;
    }
    .champ { margin-bottom: 1rem; }
    input, textarea {
      width: 100%;
      font: inherit;
      color: var(--texte);
      background: var(--bg);
      border: 1.5px solid var(--bordure);
      border-radius: 10px;
      padding: .65rem .8rem;
      transition: border-color .15s, box-shadow .15s;
    }
    textarea { resize: vertical; min-height: 90px; }
    input:focus, textarea:focus {
      outline: none;
      border-color: var(--primaire);
      box-shadow: 0 0 0 3px rgba(79, 70, 229, .2);
    }
    button {
      width: 100%;
      font: inherit;
      font-weight: 600;
      color: white;
      background: var(--primaire);
      border: 0;
      border-radius: 10px;
      padding: .8rem;
      cursor: pointer;
      transition: background .15s, transform .1s;
    }
    button:hover { background: var(--primaire-fonce); }
    button:active { transform: scale(.98); }
    button:disabled { opacity: .6; cursor: wait; }

    .message-erreur {
      display: none;
      background: var(--erreur-fond);
      color: var(--erreur);
      border-radius: 10px;
      padding: .6rem .8rem;
      font-size: .85rem;
      margin-bottom: 1rem;
    }

    /* ---------- Compteurs ---------- */
    .compteurs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: .75rem;
      margin-bottom: 1.25rem;
    }
    .compteur {
      border-radius: 12px;
      padding: .75rem;
      text-align: center;
    }
    .compteur strong { display: block; font-size: 1.6rem; line-height: 1.1; }
    .compteur span { font-size: .75rem; font-weight: 600; }
    .compteur.open { background: var(--ouvert-fond); color: var(--ouvert); }
    .compteur.in_progress { background: var(--encours-fond); color: var(--encours); }
    .compteur.done { background: var(--termine-fond); color: var(--termine); }

    /* ---------- Liste ---------- */
    .entete-liste {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }
    .entete-liste h2 { margin: 0; }
    .total { color: var(--texte-doux); font-size: .85rem; }

    .demande {
      border: 1px solid var(--bordure);
      border-left: 4px solid var(--ouvert);
      border-radius: 12px;
      padding: .9rem 1rem;
      margin-bottom: .75rem;
      animation: apparition .3s ease;
    }
    .demande.in_progress { border-left-color: var(--encours); }
    .demande.done { border-left-color: var(--termine); }
    .demande-haut {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: .75rem;
    }
    .demande h3 { font-size: 1rem; }
    .demande .desc {
      color: var(--texte-doux);
      font-size: .9rem;
      margin-top: .25rem;
      white-space: pre-wrap;
    }
    .demande .meta {
      display: flex;
      flex-wrap: wrap;
      gap: .75rem;
      margin-top: .6rem;
      font-size: .78rem;
      color: var(--texte-doux);
    }

    .badge {
      flex-shrink: 0;
      font-size: .7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .04em;
      padding: .25rem .6rem;
      border-radius: 999px;
    }
    .badge.open { background: var(--ouvert-fond); color: var(--ouvert); }
    .badge.in_progress { background: var(--encours-fond); color: var(--encours); }
    .badge.done { background: var(--termine-fond); color: var(--termine); }

    .select-statut {
      margin-left: auto;
      width: auto;
      font: inherit;
      font-size: .78rem;
      font-weight: 600;
      color: var(--texte);
      background: var(--bg);
      border: 1.5px solid var(--bordure);
      border-radius: 8px;
      padding: .25rem .5rem;
      cursor: pointer;
    }
    .select-statut:focus {
      outline: none;
      border-color: var(--primaire);
      box-shadow: 0 0 0 3px rgba(79, 70, 229, .2);
    }

    .vide {
      text-align: center;
      color: var(--texte-doux);
      padding: 2.5rem 1rem;
    }
    .vide .icone { font-size: 2.5rem; display: block; margin-bottom: .5rem; }

    /* ---------- Notification ---------- */
    .toast {
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      background: var(--termine);
      color: white;
      padding: .8rem 1.2rem;
      border-radius: 12px;
      box-shadow: var(--ombre);
      font-weight: 600;
      transform: translateY(150%);
      transition: transform .3s ease;
    }
    .toast.visible { transform: translateY(0); }

    @keyframes apparition {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <header>
    <div class="conteneur">
      <h1>Demandes internes</h1>
      <p>Enregistrez et suivez les demandes de l'équipe.</p>
    </div>
  </header>

  <main>
    <!-- Formulaire -->
    <section class="carte">
      <h2>Nouvelle demande</h2>
      <div id="erreur" class="message-erreur"></div>
      <form id="formulaire">
        <div class="champ">
          <label for="title">Titre</label>
          <input id="title" placeholder="Ex : Nouvel écran" required>
        </div>
        <div class="champ">
          <label for="requester">Votre nom</label>
          <input id="requester" placeholder="Ex : Alice" required>
        </div>
        <div class="champ">
          <label for="description">Description</label>
          <textarea id="description" placeholder="Détails (optionnel)"></textarea>
        </div>
        <button type="submit" id="bouton">Envoyer la demande</button>
      </form>
    </section>

    <!-- Liste -->
    <section class="carte">
      <div class="compteurs">
        <div class="compteur open"><strong id="n-open">0</strong><span>Ouvertes</span></div>
        <div class="compteur in_progress"><strong id="n-in_progress">0</strong><span>En cours</span></div>
        <div class="compteur done"><strong id="n-done">0</strong><span>Terminées</span></div>
      </div>

      <div class="entete-liste">
        <h2>Demandes enregistrées</h2>
        <span class="total" id="total"></span>
      </div>
      <div id="liste"></div>
    </section>
  </main>

  <div class="toast" id="toast">Demande enregistrée ✓</div>

  <script>
    const LIBELLES = { open: "Ouverte", in_progress: "En cours", done: "Terminée" };

    const formulaire = document.getElementById("formulaire");
    const bouton = document.getElementById("bouton");
    const zoneErreur = document.getElementById("erreur");

    // Envoi du formulaire -> POST /requests
    formulaire.addEventListener("submit", async (e) => {
      e.preventDefault();
      zoneErreur.style.display = "none";
      bouton.disabled = true;
      bouton.textContent = "Envoi...";

      try {
        const reponse = await fetch("/requests", {
          method: "POST",
          body: JSON.stringify({
            title: document.getElementById("title").value.trim(),
            requester: document.getElementById("requester").value.trim(),
            description: document.getElementById("description").value.trim(),
          }),
        });
        if (!reponse.ok) {
          throw new Error(await reponse.text());
        }
        formulaire.reset();
        afficherToast();
        chargerListe();
      } catch (err) {
        zoneErreur.textContent = err.message || "Erreur lors de l'envoi";
        zoneErreur.style.display = "block";
      } finally {
        bouton.disabled = false;
        bouton.textContent = "Envoyer la demande";
      }
    });

    // Chargement de la liste -> GET /requests
    async function chargerListe() {
      const reponse = await fetch("/requests");
      const demandes = await reponse.json();
      afficherCompteurs(demandes);
      afficherListe(demandes);
    }

    function afficherCompteurs(demandes) {
      for (const statut of ["open", "in_progress", "done"]) {
        document.getElementById("n-" + statut).textContent =
          demandes.filter((d) => d.status === statut).length;
      }
      document.getElementById("total").textContent =
        demandes.length + (demandes.length > 1 ? " demandes" : " demande");
    }

    function afficherListe(demandes) {
      const liste = document.getElementById("liste");
      liste.innerHTML = "";

      if (demandes.length === 0) {
        liste.innerHTML =
          '<div class="vide"><span class="icone">📭</span>Aucune demande pour le moment.</div>';
        return;
      }

      // Les plus récentes en premier
      for (const d of [...demandes].reverse()) {
        const carte = document.createElement("div");
        carte.className = "demande " + d.status;

        const haut = document.createElement("div");
        haut.className = "demande-haut";

        const titre = document.createElement("h3");
        titre.textContent = d.title;

        const badge = document.createElement("span");
        badge.className = "badge " + d.status;
        badge.textContent = LIBELLES[d.status] || d.status;

        haut.append(titre, badge);
        carte.appendChild(haut);

        if (d.description) {
          const desc = document.createElement("p");
          desc.className = "desc";
          desc.textContent = d.description;
          carte.appendChild(desc);
        }

        const meta = document.createElement("div");
        meta.className = "meta";
        const date = new Date(d.created_at).toLocaleString("fr-FR", {
          dateStyle: "medium",
          timeStyle: "short",
        });
        meta.innerHTML = "<span></span><span></span><span></span>";
        meta.children[0].textContent = "#" + d.id;
        meta.children[1].textContent = "👤 " + d.requester;
        meta.children[2].textContent = "🕒 " + date;
        // Menu pour changer le statut
        const select = document.createElement("select");
        select.className = "select-statut";
        for (const [valeur, libelle] of Object.entries(LIBELLES)) {
          const option = document.createElement("option");
          option.value = valeur;
          option.textContent = libelle;
          option.selected = valeur === d.status;
          select.appendChild(option);
        }
        select.addEventListener("change", () => changerStatut(d.id, select.value));
        meta.appendChild(select);

        carte.appendChild(meta);

        liste.appendChild(carte);
      }
    }

    // Changement de statut -> PATCH /requests/{id}
    async function changerStatut(id, statut) {
      const reponse = await fetch("/requests/" + id, {
        method: "PATCH",
        body: JSON.stringify({ status: statut }),
      });
      if (!reponse.ok) {
        alert(await reponse.text());
      }
      chargerListe();
    }

    function afficherToast() {
      const toast = document.getElementById("toast");
      toast.classList.add("visible");
      setTimeout(() => toast.classList.remove("visible"), 2500);
    }

    chargerListe();
  </script>
</body>
</html>
